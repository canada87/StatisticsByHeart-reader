name: CI

# Build + unit tests on every push to main and on pull requests. Needs no secrets and produces no release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Debug build
        run: ./gradlew --no-daemon :app:assembleDebug

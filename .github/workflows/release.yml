name: Release

# Runs on a version tag (git tag v0.1.0 && git push origin v0.1.0): tests, builds the SIGNED release APK with the
# personal key stored in GitHub secrets, and publishes it as a GitHub Release (installed/updated by Obtainium).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the APK

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Version from the tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Il tag '$tag' non e' nel formato vMAJOR.MINOR.PATCH (esempio: v0.1.0)"
            exit 1
          fi
          # versionName = 0.1.0 ; versionCode = MAJOR*10000 + MINOR*100 + PATCH (computed in app/build.gradle.kts)
          echo "SBH_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the signing keystore
        env:
          SBH_KEYSTORE_BASE64: ${{ secrets.SBH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SBH_KEYSTORE_BASE64" ]; then
            echo "::error::Manca il secret SBH_KEYSTORE_BASE64 (vedi README, 'Pubblicare una release')"
            exit 1
          fi
          echo "$SBH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sbh-release.jks"
          echo "SBH_KEYSTORE_FILE=$RUNNER_TEMP/sbh-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Signed release APK
        env:
          SBH_KEYSTORE_PASSWORD: ${{ secrets.SBH_KEYSTORE_PASSWORD }}
          SBH_KEY_ALIAS: ${{ secrets.SBH_KEY_ALIAS }}
          SBH_KEY_PASSWORD: ${{ secrets.SBH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name, verify and checksum the APK
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          out="StatisticsByHeart-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$out"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          # verify exits non-zero on a bad signature; print its output unfiltered (the line format changes between
          # build-tools versions, and a grep with no match would fail the step silently)
          "$apksigner" verify --print-certs "$out"
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$aapt2" dump badging "$out" | head -1
          sha256sum "$out" > "$out.sha256"
          echo "APK_FILE=$out" >> "$GITHUB_ENV"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.APK_FILE }}
            ${{ env.APK_FILE }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/sbh-release.jks"
